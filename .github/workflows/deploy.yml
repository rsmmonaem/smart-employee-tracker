name: Deploy to Production (CyberPanel / OpenLiteSpeed)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Package web application
        run: |
          tar --exclude='node_modules' --exclude='.next' --exclude='.git' -czf source.tar.gz apps/web ecosystem.config.js package.json package-lock.json

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ''
          script_stop: true
          script: |
            mkdir -p /home/tracmatrix.com/app.tracmatrix.com

      - name: Copy source archive to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "source.tar.gz"
          target: "/home/tracmatrix.com/app.tracmatrix.com/"

      - name: Execute atomic deployment on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ''
          script_stop: true
          script: |
            /home/tracmatrix.com/app.tracmatrix.com/deploy.sh
            echo "CI/CD Deployment finished successfully!"
