name: Build Desktop Agent (Windows & macOS)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.1.0)'
        required: false
        default: 'v1.1.0'
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-mac:
    name: Build macOS Agent (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm --prefix apps/desktop-agent ci || npm --prefix apps/desktop-agent install

      - name: Build Frontend
        run: |
          npm --prefix apps/desktop-agent run build

      - name: Build macOS Bundle
        run: |
          npx --prefix apps/desktop-agent tauri build

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macOS-Desktop-Agent
          path: |
            apps/desktop-agent/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop-agent/src-tauri/target/release/bundle/macos/*.app

  build-windows:
    name: Build Windows Agent (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: |
          npm ci || npm install
          npm --prefix apps/desktop-agent ci || npm --prefix apps/desktop-agent install

      - name: Build Frontend
        run: |
          npm --prefix apps/desktop-agent run build

      - name: Build Windows Bundle
        run: |
          npx --prefix apps/desktop-agent tauri build

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Desktop-Agent
          path: |
            apps/desktop-agent/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop-agent/src-tauri/target/release/bundle/msi/*.msi
